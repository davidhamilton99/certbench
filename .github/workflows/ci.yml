name: CI

on:
  push:
    branches: [main, rebuild]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and contract tests
        run: npm test

      - name: DB types drift check
        # Skips itself unless SUPABASE_ACCESS_TOKEN is configured.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run db:types:check

      - name: Production build
        # The SEO pages (objectives, readiness checks, practice tests) query
        # Supabase at build time to prerender, so the build needs a reachable
        # project. These are the public URL + publishable key already shipped
        # to every browser and committed in scripts/seed-*.ts — anon/RLS read
        # access only. Never put the service-role key here.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://mdvkidwkjjfgfwkogqvq.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_xofucBxlC1UmqoN8GBTglg_4Pco016c
        run: npm run build
